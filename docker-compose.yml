services:
  agentnexus:
    build: .
    container_name: agentnexus
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_DB_PATH: /app/data/platform.db
      APP_ALLOW_OUTBOUND_NETWORK: "${APP_ALLOW_OUTBOUND_NETWORK:-false}"
      APP_ALLOW_HTTP_TOOLS: "${APP_ALLOW_HTTP_TOOLS:-false}"
      APP_ALLOW_STDIO_MCP: "${APP_ALLOW_STDIO_MCP:-false}"
      APP_ALLOW_REMOTE_MCP: "${APP_ALLOW_REMOTE_MCP:-false}"
      APP_ALLOW_WEB_SEARCH: "${APP_ALLOW_WEB_SEARCH:-false}"
      APP_ALLOW_HTTP_POLICY: "${APP_ALLOW_HTTP_POLICY:-false}"
      APP_ALLOW_REMOTE_INSTALL: "${APP_ALLOW_REMOTE_INSTALL:-false}"
      APP_STDIO_COMMAND_ALLOWLIST: "${APP_STDIO_COMMAND_ALLOWLIST:-npx,node,python3,uvx}"
      APP_REMOTE_HOST_ALLOWLIST: "${APP_REMOTE_HOST_ALLOWLIST:-}"
      APP_MODEL_HOST_ALLOWLIST: "${APP_MODEL_HOST_ALLOWLIST:-api.openai.com}"
      APP_HTTP_POLICY_ALLOWLIST: "${APP_HTTP_POLICY_ALLOWLIST:-}"
      APP_POLICY_RULES_JSON: "${APP_POLICY_RULES_JSON:-[]}"
      APP_REMOTE_INSTALL_HOST_ALLOWLIST: "${APP_REMOTE_INSTALL_HOST_ALLOWLIST:-github.com,raw.githubusercontent.com,gitlab.com}"
      APP_SKILL_LOCAL_ROOTS: "${APP_SKILL_LOCAL_ROOTS:-}"
      APP_MAX_UPLOAD_MB: "${APP_MAX_UPLOAD_MB:-20}"
      APP_ARTIFACT_DIR: "${APP_ARTIFACT_DIR:-/app/data/artifacts}"
      APP_UPLOAD_DIR: "${APP_UPLOAD_DIR:-/app/data/uploads}"
      APP_NODE_BINARY: "${APP_NODE_BINARY:-node}"
      APP_ARTIFACT_TOOL_ENTRYPOINT: "${APP_ARTIFACT_TOOL_ENTRYPOINT:-}"
      APP_PRESENTATION_TIMEOUT_SECONDS: "${APP_PRESENTATION_TIMEOUT_SECONDS:-180}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      APP_SECRET_KEY_FILE: "${APP_SECRET_KEY_FILE:-/app/data/.secret_key}"
      APP_DETERMINISTIC_STREAM_CHARS: "${APP_DETERMINISTIC_STREAM_CHARS:-8}"
      APP_DETERMINISTIC_STREAM_DELAY_MS: "${APP_DETERMINISTIC_STREAM_DELAY_MS:-20}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
    volumes:
      - ./data:/app/data
